name: Build Samsung Remote IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project SamsungRemote.xcodeproj -scheme SamsungRemote -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SamsungRemote.app" Payload/
          zip -qry SamsungRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SamsungRemote-unsigned-IPA
          path: SamsungRemote-unsigned.ipa
          retention-days: 7
